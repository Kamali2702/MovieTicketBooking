
<div class="app-shell">

  <!-- Application header -->
  <header class="site-header">
    <div class="header-inner">

      <a class="brand"
         routerLink="/"
         aria-label="Movie Ticket Booking home">

        <span class="brand-icon">M</span>

        <span class="brand-name">
          MOVIE
          <small>TICKET BOOKING</small>
        </span>

      </a>

      <!-- Main navigation -->
      <nav class="main-nav" aria-label="Main navigation">

        <a routerLink="/"
           routerLinkActive="active"
           [routerLinkActiveOptions]="{ exact: true }">
          Home
        </a>

        <a routerLink="/" fragment="experience">
          How it works
        </a>

      </nav>

      <a class="header-button"
         routerLink="/"
         fragment="experience">

        Get started
        <span aria-hidden="true">↗</span>

      </a>

    </div>
  </header>


  <!-- Angular displays the selected page here -->
  <main class="page-content">
    <router-outlet />
  </main>


  <!-- Application footer -->
  <footer class="site-footer">

    <div class="footer-inner">

      <div>
        <strong>MOVIE TICKET BOOKING</strong>
        <p>Your next movie experience starts here.</p>
      </div>

      <p class="copyright">
        © 2026 Movie Ticket Booking. All rights reserved.
      </p>

    </div>

  </footer>

</div>
